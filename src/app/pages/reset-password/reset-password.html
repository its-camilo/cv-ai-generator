<section class="login" aria-labelledby="reset-title">
  <app-grainient
    color1="#faf3e8"
    color2="#e8d5b5"
    color3="#d9c4a0"
    [timeSpeed]="0.12"
    [grainAmount]="0.08"
  />

  <div class="login__vignette" aria-hidden="true"></div>
  <div class="login__frame login__frame--tl" aria-hidden="true"></div>
  <div class="login__frame login__frame--br" aria-hidden="true"></div>

  <div class="login__layout login__layout--single">
    <div class="login__content">
      <p class="login__eyebrow">
        <span class="login__eyebrow-line" aria-hidden="true"></span>
        Seguridad de tu cuenta
      </p>

      <h1 id="reset-title" class="login__title">Nueva <span class="login__title-accent">contraseña</span></h1>

      <p class="login__lede">
        Queda en tu misma cuenta: podrás entrar con Google o con tu correo y esta contraseña.
      </p>

      <form class="login__form" [formGroup]="form" (ngSubmit)="handleSubmit()" novalidate>
        <label class="login__field">
          <span class="login__label">Contraseña</span>
          <input class="login__input" type="password" formControlName="password" autocomplete="new-password" />
        </label>

        <label class="login__field">
          <span class="login__label">Confirmar contraseña</span>
          <input class="login__input" type="password" formControlName="confirm" autocomplete="new-password" />
        </label>

        @if (error()) {
          <p class="login__message login__message--error" role="alert">{{ error() }}</p>
        }

        <button type="submit" class="login__button login__button--solid" [disabled]="isSaving()">
          {{ isSaving() ? 'Guardando…' : 'Guardar contraseña' }}
        </button>
      </form>
    </div>
  </div>
</section>
